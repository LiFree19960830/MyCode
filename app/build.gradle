apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.0"
    defaultConfig {
        applicationId "com.huasu.bess4c48"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 3
        versionName "1.0.2"
        multiDexEnabled true
        flavorDimensions "default"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                //为EventBus建立索引,参数为想要生成的完整class名
                arguments = [eventBusIndex        : 'com.huasu.c48.MyEventBusIndex',
                             "room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    ndkVersion '21.1.6352462'
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "appC48_V${defaultConfig.versionName}-" + output.name
            appName = appName.replace("-release", "")
            def currentTime = new Date().format("yyMMdd", TimeZone.getTimeZone("GMT+08:00"))
            outputFileName = "${appName}-${currentTime}.apk"
        }
    }
    productFlavors {
        /*************湖州华塑版本*******************/
        huasu {
            // apk包基本信息
            applicationId 'com.huasu.bess4c48'
            versionCode 4
            versionName "1.0.3"
        }
        /*************标准版本*******************/
        standard {
            // apk包基本信息
            applicationId 'com.huasu.bess4c48'
            versionCode 3
            versionName "1.0.2"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'

    implementation "androidx.activity:activity:1.2.0"
    implementation 'androidx.recyclerview:recyclerview:1.0.0'

    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    // implementation 'com.github.getActivity:ToastUtils:10.3'
    //EventBus
    implementation 'org.greenrobot:eventbus:3.1.1'
    annotationProcessor 'org.greenrobot:eventbus-annotation-processor:3.1.1'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.25'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'com.github.penfeizhou.android.animation:apng:2.4.2'
    implementation 'com.github.lihangleo2:ShadowLayout:3.3.2'
    implementation 'io.github.h07000223:flycoTabLayout:3.0.0'
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    //room数据库
    implementation 'androidx.room:room-runtime:2.2.3'
    implementation 'androidx.room:room-rxjava2:2.2.3'
    annotationProcessor 'androidx.room:room-compiler:2.2.3'
    implementation 'com.github.huburt-Hu:NewbieGuide:v2.4.0'
    // APNG播放库
    implementation 'com.github.penfeizhou.android.animation:apng:2.4.2'
    //Rxjava2
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    // Retrofit2
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.4.0'
}
